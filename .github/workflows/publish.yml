name: CL - Club Legacy | Construir e publicar

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no Roblox? Desmarcado = somente compilar."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: club-legacy-publicacao
  cancel-in-progress: false

jobs:
  construir:
    name: Validar e compilar; publicar somente com autorizacao
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Conferir scripts principais
        run: |
          set -euo pipefail
          test -s default.project.json
          test -s src/server/Main.server.luau
          test -s src/client/Main.client.luau

      - name: Instalar Rojo 7.7.1
        run: cargo install rojo --version 7.7.1 --locked

      - name: Validar configuracao JSON
        run: python3 -m json.tool default.project.json > /dev/null

      - name: Construir experiencia Roblox
        run: |
          set -euo pipefail
          rojo build default.project.json --output club-legacy.rbxlx
          test -s club-legacy.rbxlx

      - name: Disponibilizar projeto compilado
        uses: actions/upload-artifact@v4
        with:
          name: club-legacy-rbxlx
          path: club-legacy.rbxlx
          if-no-files-found: error

      - name: Bloquear publicacao dos scripts temporarios
        if: ${{ inputs.publicar }}
        run: |
          set -euo pipefail
          if grep -q "CL_SCAFFOLD_PLACEHOLDER" src/server/Main.server.luau || grep -q "CL_SCAFFOLD_PLACEHOLDER" src/client/Main.client.luau; then
            echo "::error::Os scripts ainda sao temporarios. Integre os codigos definitivos do CL - Club Legacy antes de publicar."
            exit 1
          fi

      - name: Publicar na experiencia Roblox reaproveitada
        if: ${{ inputs.publicar }}
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "9749365367"
          PLACE_ID: "86256105108811"
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY" ]]; then
            echo "::error::Cadastre o secret ROBLOX_API_KEY neste repositorio."
            exit 1
          fi
          if [[ ! "$UNIVERSE_ID" =~ ^[0-9]+$ || ! "$PLACE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Os IDs da experiencia Roblox sao invalidos."
            exit 1
          fi

          echo "Publicacao manual autorizada para o Universe ID ${UNIVERSE_ID}, Place ID ${PLACE_ID}."
          curl --fail-with-body --show-error --silent \
            --request POST \
            --url "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @club-legacy.rbxlx
