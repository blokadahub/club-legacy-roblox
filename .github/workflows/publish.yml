name: CL 27 | Publicação manual Roblox

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar no destino configurado? Desmarcado compila somente.
        type: boolean
        required: true
        default: false
      confirmar_place_id:
        description: Digite exatamente o ROBLOX_PLACE_ID configurado para confirmar o destino.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: cl27-publicacao
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publicar somente no destino confirmado
    needs: build
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: roblox-production
    steps:
      - name: Obter experiência validada
        uses: actions/download-artifact@v4
        with:
          name: club-legacy-rbxlx

      - name: Validar configuração e publicar com Open Cloud
        shell: bash
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: "9749365367"
          PLACE_ID: "86256105108811"
          CONFIRMED_PLACE_ID: ${{ inputs.confirmar_place_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Publicação permitida somente na branch main. Selecione main ao executar o workflow."
            exit 1
          fi
          if [[ -z "$API_KEY" ]]; then
            echo '::error::Configure o secret ROBLOX_API_KEY no ambiente roblox-production ou no repositório.'
            exit 1
          fi
          if [[ ! "$UNIVERSE_ID" =~ ^[1-9][0-9]*$ || ! "$PLACE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Configure as variáveis ROBLOX_UNIVERSE_ID e ROBLOX_PLACE_ID com o destino revisado.'
            exit 1
          fi
          if [[ "$CONFIRMED_PLACE_ID" != "$PLACE_ID" ]]; then
            echo '::error::A confirmação não corresponde ao Place ID configurado. Publicação cancelada.'
            exit 1
          fi
          # Conferir a relação Place → Universe antes de substituir a experiência existente.
          place_meta=$(curl --fail-with-body --silent --show-error \
            "https://apis.roblox.com/universes/v1/places/${PLACE_ID}/universe")
          PLACE_METADATA="$place_meta" python3 - <<'PY'
          import json, os, sys
          try:
              actual_universe = str(json.loads(os.environ["PLACE_METADATA"])["universeId"])
          except (ValueError, KeyError, TypeError) as exc:
              sys.exit(f"::error::Não foi possível conferir o Universe ID do Place: {exc}")
          expected_universe = os.environ["UNIVERSE_ID"]
          if actual_universe != expected_universe:
              sys.exit(f"::error::Place ID pertence ao Universe {actual_universe}, diferente do destino autorizado {expected_universe}. Publicação cancelada.")
          print("Place ID e Universe ID conferidos no Roblox.")
          PY
          test -s club-legacy.rbxlx
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${API_KEY}" \
            --header 'Content-Type: application/xml' \
            --data-binary @club-legacy.rbxlx)
          OPEN_CLOUD_RESPONSE="$response" python3 - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ["OPEN_CLOUD_RESPONSE"])
              number = data.get("versionNumber")
              if type(number) is not int or number < 1:
                  raise ValueError("versionNumber ausente ou inválido")
          except (ValueError, TypeError, AttributeError) as exc:
              print(f"::error::Resposta inesperada do Roblox Open Cloud: {exc}")
              sys.exit(1)
          place = os.environ["PLACE_ID"]
          print(f"Roblox confirmou nova versão publicada: {number} (Place ID: {place}).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### CL 27 publicado no Roblox\n\nPlace ID: `{place}`  \nVersão Roblox: `{number}`  \nBranch: `main`\n")
          PY
